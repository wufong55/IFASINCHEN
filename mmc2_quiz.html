<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --primary: #3b82f6;
    }
    .option-label {
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      background-color: var(--card);
      transition: all 0.2s;
    }
    .option-label:not(.disabled-label):hover {
      border-color: #94a3b8;
    }
    .option-input {
      margin-top: 0.25rem;
      margin-right: 0.75rem;
      cursor: pointer;
    }
    .disabled-label {
      cursor: default;
    }
    .selected {
      border-color: var(--primary) !important;
      background-color: rgba(59, 130, 246, 0.05) !important;
    }
    .correct {
      border-color: #22c55e !important;
      background-color: rgba(34, 197, 94, 0.05) !important;
    }
    .wrong {
      border-color: #ef4444 !important;
      background-color: rgba(239, 68, 68, 0.05) !important;
    }
    .disabled {
      pointer-events: none;
      opacity: 0.9;
    }
    .btn {
      background-color: var(--primary);
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-secondary {
      background-color: #64748b;
    }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
  </style>
</head>

      },
      {
        title: "第 25 題【選擇題】：嬰兒先天性重大缺損保險金給付額度",
        question: "活產嬰兒於七足歲前經教學醫院專科醫師確診罹患附表一之「嬰兒先天性重大缺損」，其保險金給付金額為何？",
        type: "single",
        options: { "A": "按投保單位乘以新臺幣 10 萬元", "B": "按投保單位乘以新臺幣 30 萬元", "C": "按投保單位乘以新臺幣 50 萬元", "D": "按投保單位乘以新臺幣 100 萬元" },
        answer: ["C"],
        explanation: "依第十八條第一項，經教學醫院專科醫師確診罹患附表一之嬰兒先天性重大缺損時，按「投保單位」乘以新臺幣五十萬元給付，每一位活產嬰兒以一次為限。"

    let currentQuestionIndex = 0;
    let answersHistory = []; // Store history objects: { userAnswers: [], isCorrect: boolean }
    let selectedOptions = new Set();

    const app = document.getElementById('app');

    function renderStart() {
      app.innerHTML = `
        <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-8 shadow-sm flex flex-col items-center justify-center h-full my-auto text-center">
          <h1 class="text-3xl font-bold mb-4">MMC2條款小學堂</h1>
          <p class="text-[var(--muted-foreground)] mb-8 text-lg">共 25 題測驗，測試您對保單條款的了解！</p>
          <button class="btn text-lg" onclick="startQuiz()">開始測驗</button>
        </div>
      `;
    }

    function startQuiz() {
      currentQuestionIndex = 0;
      answersHistory = [];
      renderQuestion();
    }

    function calculateScore() {
      return answersHistory.filter(h => h && h.isCorrect).length;
    }

    function renderQuestion() {
      const q = questions[currentQuestionIndex];
      const isMulti = q.type === 'multiple';
      
      const history = answersHistory[currentQuestionIndex];
      const isAnswered = !!history;
      
      if (!isAnswered) {
        selectedOptions.clear();
      }

      const userAnswersArray = isAnswered ? history.userAnswers : Array.from(selectedOptions);

      let optionsHtml = '';
      for (const [key, text] of Object.entries(q.options)) {
        const isChecked = userAnswersArray.includes(key);
        optionsHtml += `
          <label class="option-label ${isAnswered ? 'disabled-label' : ''}" id="label-${key}">
            <input type="${isMulti ? 'checkbox' : 'radio'}" name="answer" value="${key}" class="option-input" 
              onchange="handleOptionChange('${key}', ${isMulti})" 
              ${isChecked ? 'checked' : ''} 
              ${isAnswered ? 'disabled' : ''}>
            <div>
              <span class="font-semibold mr-1">${key}.</span>
              <span>${text}</span>
            </div>
          </label>
        `;
      }

      app.innerHTML = `
        <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-6 shadow-sm flex-1 flex flex-col">
          <div class="flex justify-between items-center mb-4 text-sm text-[var(--muted-foreground)] border-b border-[var(--border)] pb-2">
            <span class="font-semibold">${q.title}</span>
            <span>第 ${currentQuestionIndex + 1} / ${questions.length} 題</span>
          </div>
          
          <div class="text-lg font-medium mb-6 leading-relaxed">
            ${q.question}
          </div>
          
          <div class="flex-1 ${isAnswered ? 'disabled' : ''}" id="options-container">
            ${optionsHtml}
          </div>

          <div id="feedback-container" class="mt-4 mb-4 hidden p-4 rounded-lg bg-[var(--muted)] text-sm">
            <div id="feedback-icon" class="font-bold text-lg mb-1"></div>
            <div id="feedback-text" class="text-[var(--foreground)] leading-relaxed"></div>
          </div>

          <div class="mt-4 flex justify-between items-center pt-4 border-t border-[var(--border)]">
            <button id="prev-btn" class="btn btn-secondary ${currentQuestionIndex === 0 ? 'invisible' : ''}" onclick="prevQuestion()">上一題</button>
            <div class="text-sm font-medium" id="score-display">目前分數: ${calculateScore()}</div>
            <button id="action-btn" class="btn" ${!isAnswered && selectedOptions.size === 0 ? 'disabled' : ''} onclick="submitOrNext()">
              ${isAnswered ? (currentQuestionIndex === questions.length - 1 ? '看結果' : '下一題') : '送出答案'}
            </button>
          </div>
        </div>
      `;

      if (isAnswered) {
        applyFeedbackStyling(q, history.userAnswers);
      }
    }

    function handleOptionChange(key, isMulti) {
      if (answersHistory[currentQuestionIndex]) return; // already answered
      
      const btn = document.getElementById('action-btn');
      
      if (!isMulti) {
        selectedOptions.clear();
        selectedOptions.add(key);
        // UI updates for single select radio button styling
        document.querySelectorAll('.option-label').forEach(el => el.classList.remove('selected'));
        document.getElementById(`label-${key}`).classList.add('selected');
      } else {
        const checkbox = document.querySelector(`input[value="${key}"]`);
        if (checkbox.checked) {
          selectedOptions.add(key);
          document.getElementById(`label-${key}`).classList.add('selected');
        } else {
          selectedOptions.delete(key);
          document.getElementById(`label-${key}`).classList.remove('selected');
        }
      }

      btn.disabled = selectedOptions.size === 0;
    }

    function applyFeedbackStyling(q, userAnswersArray) {
      const correctAnswers = q.answer;
      
      // Highlight options
      for (const [key, text] of Object.entries(q.options)) {
        const labelEl = document.getElementById(`label-${key}`);
        labelEl.classList.remove('selected');
        
        if (correctAnswers.includes(key)) {
          labelEl.classList.add('correct');
        } else if (userAnswersArray.includes(key)) {
          labelEl.classList.add('wrong');
        }
      }

      const isCorrect = 
        correctAnswers.length === userAnswersArray.length && 
        correctAnswers.every(ans => userAnswersArray.includes(ans));

      // Show feedback
      const feedbackContainer = document.getElementById('feedback-container');
      const feedbackIcon = document.getElementById('feedback-icon');
      const feedbackText = document.getElementById('feedback-text');
      
      feedbackContainer.classList.remove('hidden');
      if (isCorrect) {
        feedbackIcon.innerHTML = '✅ 答對了！';
        feedbackIcon.className = 'font-bold text-lg mb-1 text-green-600';
      } else {
        feedbackIcon.innerHTML = `❌ 答錯了！正確答案是：${correctAnswers.join(', ')}`;
        feedbackIcon.className = 'font-bold text-lg mb-1 text-red-600';
      }
      feedbackText.innerHTML = q.explanation;
    }

    function submitOrNext() {
      const history = answersHistory[currentQuestionIndex];
      if (history) { 
        // already answered, go to next
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
          renderQuestion();
        } else {
          renderResult();
        }
        return;
      }

      // submitting answer
      const q = questions[currentQuestionIndex];
      const correctAnswers = q.answer;
      const userAnswersArray = Array.from(selectedOptions);
      
      const isCorrect = 
        correctAnswers.length === userAnswersArray.length && 
        correctAnswers.every(ans => userAnswersArray.includes(ans));

      answersHistory[currentQuestionIndex] = {
        userAnswers: userAnswersArray,
        isCorrect: isCorrect
      };

      // Disable inputs
      document.querySelectorAll('.option-input').forEach(input => {
        input.disabled = true;
      });
      document.querySelectorAll('.option-label').forEach(label => {
        label.classList.add('disabled-label');
      });
      document.getElementById('options-container').classList.add('disabled');

      applyFeedbackStyling(q, userAnswersArray);

      // Update button
      const btn = document.getElementById('action-btn');
      btn.innerText = currentQuestionIndex === questions.length - 1 ? '看結果' : '下一題';
      
      // Update score
      document.getElementById('score-display').innerText = `目前分數: ${calculateScore()}`;
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
      }
    }

    function renderResult() {
      const finalScore = calculateScore();
      const percentage = Math.round((finalScore / questions.length) * 100);
      let message = '';
      if (percentage >= 90) message = '太棒了！您對條款非常了解。';
      else if (percentage >= 60) message = '不錯喔！但還有進步空間。';
      else message = '建議您再多複習一下條款喔！';

      app.innerHTML = `
        <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-8 shadow-sm flex flex-col items-center justify-center h-full my-auto text-center">
          <h1 class="text-3xl font-bold mb-6">測驗完成</h1>
          <div class="text-5xl font-bold text-blue-600 mb-2">${finalScore} / ${questions.length}</div>
          <div class="text-xl mb-6">得分: ${percentage} 分</div>
          <p class="text-[var(--muted-foreground)] mb-8">${message}</p>
          <div class="flex gap-4">
            <button class="btn btn-secondary" onclick="prevQuestion()">回顧最後一題</button>
            <button class="btn" onclick="startQuiz()">重新測驗</button>
          </div>
        </div>
      `;
    }

    // Initialize
    renderStart();
  </script>
</body>
</html>
